name: Sync LeetCode solutions

on:
  schedule:
    # 02:30 UTC = ~08:00 IST daily
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync new LeetCode solutions
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/leetcode_sync.py

      - name: Update README with any new solutions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode README.md scripts/.metadata_cache.json scripts/.leetcode_sync_state.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: sync new LeetCode solutions"

          # If someone pushed to main while this job was running, retry once
          # with a rebase instead of failing the whole run outright.
          for attempt in 1 2; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt) — pulling and retrying..."
            git pull --rebase origin main
          done